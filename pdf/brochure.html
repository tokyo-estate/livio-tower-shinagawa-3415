<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Brochure</title>
<style>
:root{--gold:#c9a962;--gold2:#d9bf7a;--dark:#0b0d10;--paper:#f4f1ea;--paper2:#ebe6dc;--ink:#1b1b1b;--mute:#6d675d;--line:#d8d2c6}
@page{size:A4;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;color:var(--ink);background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html[lang="zh"] body{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif}
html[lang="en"] body{font-family:"Helvetica Neue","Hiragino Sans",sans-serif}
br.sp{display:none}
.page{width:210mm;height:297mm;overflow:hidden;position:relative;page-break-after:always;background:var(--paper)}
.page:last-child{page-break-after:auto}
.page.dark{background:var(--dark);color:#fff}
.page .inner{position:absolute;left:14mm;right:14mm;top:13mm;bottom:15mm;overflow:hidden}
.foot{position:absolute;left:14mm;right:14mm;bottom:7mm;display:flex;justify-content:space-between;font-size:6.5pt;letter-spacing:.2em;color:var(--mute);text-transform:uppercase}
.dark .foot{color:#8f887c}
.no{display:flex;align-items:center;gap:4mm;font-size:7.5pt;font-weight:500;letter-spacing:.34em;color:var(--gold);text-transform:uppercase}
.no::before{content:"";width:9mm;height:1px;background:var(--gold)}
h2{font-size:16pt;font-weight:300;letter-spacing:.08em;line-height:1.45;margin:2.5mm 0 2mm}
.lead,.hd p{font-size:8.3pt;line-height:1.75;color:var(--mute);max-width:165mm}
.dark .lead,.dark .hd p{color:#cfc9bd}
.hd{margin-bottom:4mm}
.row{display:grid;gap:3.5mm;margin-bottom:3.5mm}
.row.c2{grid-template-columns:1fr 1fr}.row.c3{grid-template-columns:1fr 1fr 1fr}
.ph{overflow:hidden;background:#222}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
.ph.contain{background:#fff}.ph.contain img{object-fit:contain}
figcaption,.cap{font-size:6.8pt;color:var(--mute);margin-top:1.3mm;line-height:1.4}
.dark figcaption{color:#b9b2a5}
figcaption .t{font-weight:500;color:var(--ink)}.dark figcaption .t{color:#fff}
figcaption .d{display:block}
.note{font-size:6.6pt;line-height:1.6;color:var(--mute);text-indent:-1em;padding-left:1em;margin:1.5mm 0}
.dark .note{color:#9b9488}
.big{font-size:24pt;font-weight:200;line-height:1;margin:2mm 0}
.big small{font-size:8pt;color:var(--mute);margin-left:2mm}
ul{list-style:none}
.chips{display:flex;flex-wrap:wrap;gap:1.5mm 2mm;margin:2.5mm 0}
.chips li{font-size:7.2pt;padding:1.1mm 3mm;border:1px solid var(--line);border-radius:99px}
.dark .chips li{border-color:rgba(255,255,255,.4)}
.floors{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3mm;margin:2mm 0 3.5mm}
.floors li{border:1px solid var(--line);padding:2.5mm 3mm;font-size:7pt;line-height:1.55}
.dark .floors li{border-color:rgba(255,255,255,.25)}
.floors .f{font-size:12pt;font-weight:200;color:var(--gold);line-height:1;margin-bottom:1.5mm}
.floors .n span{display:block;font-weight:500}
.floors .d{color:var(--mute);margin-top:1mm}.dark .floors .d{color:#b9b2a5}
.tl{display:grid;grid-template-columns:1fr 1fr;gap:2.5mm 6mm;margin:1mm 0 3.5mm}
.tl li{border-left:2px solid var(--gold);padding:.5mm 0 .5mm 3mm;font-size:7.2pt;line-height:1.5}
.tl .y{color:var(--gold);font-weight:500;letter-spacing:.06em}.tl .t{font-weight:500}.tl .d{color:var(--mute)}.dark .tl .d{color:#b9b2a5}
.times{display:grid;grid-template-columns:1fr 1fr;gap:1mm 8mm;margin:2mm 0 3mm}
.times li{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid rgba(127,127,127,.3);padding:1.3mm 0;font-size:8pt}
.times .to small{font-size:6.5pt;color:var(--gold);margin-left:1mm}
.times .m{font-size:13pt;font-weight:200}.times .m small{font-size:6.5pt;margin-left:.5mm;color:var(--gold)}
.eq{display:grid;grid-template-columns:repeat(4,1fr);gap:3mm;margin:2mm 0 3mm}
.eq li img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
.eq .n{font-size:7pt;margin-top:1.2mm;line-height:1.4}
.tbl2{display:grid;grid-template-columns:1fr 1fr;gap:5mm;margin-bottom:3mm}
.tbl{width:100%;border-collapse:collapse;font-size:6.9pt;line-height:1.5}
.tbl th,.tbl td{border-top:1px solid var(--line);padding:1.5mm 1.5mm;text-align:left;vertical-align:top}
.tbl th{width:22mm;color:var(--gold);font-weight:500;white-space:nowrap}
.tbl b{font-size:9pt}.tbl small{font-size:6pt}
/* cover / back */
.cover{background:#000}
.cover .bg{position:absolute;inset:0}.cover .bg img{width:100%;height:100%;object-fit:cover}
.cover .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,0) 30%,rgba(0,0,0,.15) 55%,rgba(0,0,0,.92))}
.cover .in{position:absolute;left:14mm;right:14mm;bottom:15mm;color:#fff}
.cover .en{font-size:8pt;letter-spacing:.36em;color:var(--gold2);text-transform:uppercase}
.cover .no{display:block;font-size:60pt;font-weight:200;line-height:1;margin-top:3mm;letter-spacing:-.01em;color:#fff}
.cover .no::before{display:none}
.cover .no small{font-size:14pt;font-weight:300;letter-spacing:.2em;margin-left:3mm;color:var(--gold2)}
.cover h1{font-size:16pt;font-weight:400;letter-spacing:.14em;margin-top:2.5mm}
.cover .tag{font-size:9.5pt;font-weight:300;letter-spacing:.12em;color:var(--gold2);margin-top:2mm}
.cover .spec{display:flex;flex-wrap:wrap;gap:1.5mm 2mm;margin:3mm 0}
.cover .spec li{font-size:7.3pt;padding:1.1mm 3mm;border:1px solid rgba(255,255,255,.45);border-radius:99px}
.cover .p,.back .p{display:flex;align-items:baseline;gap:3mm;font-size:9pt;letter-spacing:.12em;margin-top:2mm}
.cover .p b,.back .p b{font-size:24pt;font-weight:700;color:var(--gold2)}
.cover .p small{font-size:7.5pt;color:#cfc9bd}
.keys{margin-top:5mm}
.keys ul{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid rgba(255,255,255,.25)}
.keys li{text-align:center;padding:3mm 1mm;border-right:1px solid rgba(255,255,255,.25)}
.keys li:last-child{border-right:0}
.keys .v{font-size:14pt;font-weight:200;line-height:1.1;white-space:nowrap}
.keys .v small{font-size:6.5pt;margin-left:.5mm;color:var(--gold2)}
.keys .k{font-size:5.4pt;letter-spacing:.18em;color:#9b9488;margin-top:1.2mm;text-transform:uppercase}
.back .in h2{font-size:21pt;color:#fff}
.back .in ul{display:flex;flex-wrap:wrap;gap:1.5mm 2mm;margin:3mm 0}
.back .in ul li{font-size:7.3pt;padding:1.1mm 3mm;border:1px solid rgba(255,255,255,.45);border-radius:99px}
.back .url{font-size:7pt;color:#b9b2a5;margin-top:5mm;letter-spacing:.06em}
</style>
</head>
<body>
<script>
const DATA={"chapters": [{"no": "01 — Floor Plan", "light": true, "h2": "<h2 data-i18n=\"L410\">最上階、15邸だけの<br/>プレミアムフロア</h2>", "lead": "", "blocks": [{"type": "row", "cols": 1, "figs": [{"type": "fig", "src": "img/u00_plan3d.jpg", "w": 1800, "h": 1800, "cap": "<span class=\"t\" data-i18n=\"L015\">3D間取図</span><span class=\"d\" data-i18n=\"L016\">　家具はイメージです</span>"}]}, {"type": "html", "cls": "big", "html": "<div class=\"big\" data-i18n=\"L411\">130.24<small data-i18n=\"L019\">㎡（壁芯）</small></div>"}, {"type": "html", "cls": "chips", "html": "<ul class=\"chips\">\n<li data-i18n=\"L413\">LD 25.5帖</li><li data-i18n=\"L414\">キッチン 4.7帖</li><li data-i18n=\"L415\">洋室(1) 10.0帖</li><li data-i18n=\"L206\">洋室(2) 6.0帖</li><li data-i18n=\"L416\">洋室(3) 6.0帖</li><li data-i18n=\"L417\">WIC 2.3・0.8・1.2帖</li><li data-i18n=\"L418\">SIC 2.0帖</li><li data-i18n=\"L419\">浴室 1822</li><li data-i18n=\"L408\">天井高 約2.9m</li><li data-i18n=\"L420\">2面バルコニー（ウッドデッキ）</li><li data-i18n=\"L421\">トランクルーム 1.46㎡</li>\n</ul>"}]}, {"no": "02 — View", "light": false, "h2": "<h2 data-i18n=\"L422\">34階、最上階の眺望</h2>", "lead": "<p class=\"lead\" data-i18n=\"L423\">レインボーブリッジとお台場、<br class=\"sp\"/>東京湾のパノラマ。<br/>運河の先には都心のスカイライン。<br/>視界を遮るもののない<br class=\"sp\"/>最上階の眺めが広がります。</p>", "blocks": [{"type": "row", "cols": 1, "figs": [{"type": "fig", "src": "img/u20_view_rainbow.jpg", "w": 1800, "h": 1344, "cap": "<span class=\"t\" data-i18n=\"L424\">レインボーブリッジとお台場</span><span class=\"d\" data-i18n=\"L425\">　34階からの眺望（2026年6月撮影）</span>"}]}, {"type": "row", "cols": 3, "figs": [{"type": "fig", "src": "img/u21_view_bay.jpg", "w": 1800, "h": 1344, "cap": "<span class=\"t\" data-i18n=\"L426\">東京湾方向</span><span class=\"d\" data-i18n=\"L427\">　レインボーブリッジと湾岸のタワー群</span>"}, {"type": "fig", "src": "img/u22_view_canal.jpg", "w": 1800, "h": 1344, "cap": "<span class=\"t\" data-i18n=\"L428\">運河と都心方向</span><span class=\"d\" data-i18n=\"L429\">　品川ふ頭と高浜運河</span>"}, {"type": "fig", "src": "img/u24_view_city.jpg", "w": 1344, "h": 1800, "cap": "<span class=\"t\" data-i18n=\"L430\">都心・東京タワー方向</span><span class=\"d\" data-i18n=\"L431\">　港南から芝浦のスカイライン</span>"}]}, {"type": "row", "cols": 2, "figs": [{"type": "fig", "src": "img/u25_balcony_view.jpg", "w": 1800, "h": 1344, "cap": "<span class=\"t\" data-i18n=\"L432\">バルコニーから</span><span class=\"d\" data-i18n=\"L433\">　ウッドデッキ越しの東京湾</span>"}, {"type": "fig", "src": "img/u23_balcony.jpg", "w": 1800, "h": 1344, "cap": "<span class=\"t\" data-i18n=\"L434\">バルコニー1</span><span class=\"d\" data-i18n=\"L435\">　ウッドデッキ仕上げ、約18.82㎡</span>"}]}]}, {"no": "03 — Living Dining", "light": true, "h2": "<h2 data-i18n=\"L436\">約25.5帖のLDに、<br/>2面の角窓</h2>", "lead": "<p class=\"lead\" data-i18n=\"L437\">天井高約2.9mのリビング<br class=\"sp\"/>ダイニングは、コーナーで出会う<br class=\"sp\"/>2面のフィックス窓が主役。<br/>大判の石目調タイルと<br class=\"sp\"/>折り上げ天井の間接照明が、<br class=\"sp\"/>眺望を静かに引き立てます。</p>", "blocks": [{"type": "row", "cols": 1, "figs": [{"type": "fig", "src": "img/u01_ldk_corner.jpg", "w": 1800, "h": 1005, "cap": "<span class=\"t\" data-i18n=\"L223\">リビングダイニング</span><span class=\"d\" data-i18n=\"L438\">　コーナーウィンドウ越しにレインボーブリッジ</span>"}]}, {"type": "row", "cols": 3, "figs": [{"type": "fig", "src": "img/u02_ldk_kitchen_side.jpg", "w": 1800, "h": 1005, "cap": "<span class=\"t\" data-i18n=\"L439\">キッチン側から</span><span class=\"d\" data-i18n=\"L440\">　約25.5帖の広がり</span>"}, {"type": "fig", "src": "img/u03_ldk_window_kitchen.jpg", "w": 1800, "h": 1005, "cap": "<span class=\"t\" data-i18n=\"L441\">窓側から</span><span class=\"d\" data-i18n=\"L442\">　対面キッチンと都心方向の眺め</span>"}, {"type": "fig", "src": "img/u04_kitchen_island.jpg", "w": 1800, "h": 1005, "cap": "<span class=\"t\" data-i18n=\"L029\">アイランドキッチン</span><span class=\"d\" data-i18n=\"L443\">　白い天板の向こうに東京湾</span>"}]}, {"type": "row", "cols": 3, "figs": [{"type": "fig", "src": "img/u05_ldk_corner_bay.jpg", "w": 1800, "h": 1344, "cap": "<span class=\"t\" data-i18n=\"L005\">コーナーウィンドウ</span><span class=\"d\" data-i18n=\"L444\">　レインボーブリッジと、バルコニーへの出入口</span>"}, {"type": "fig", "src": "img/u06_kitchen_stove.jpg", "w": 1800, "h": 1350, "cap": "<span class=\"t\" data-i18n=\"x019\">ガラストップコンロ</span><span class=\"d\" data-i18n=\"L446\">　石目調カウンター</span>"}, {"type": "fig", "src": "img/u07_kitchen_miele.jpg", "w": 1800, "h": 1350, "cap": "<span class=\"t\" data-i18n=\"L447\">Miele 食器洗浄機</span><span class=\"d\" data-i18n=\"L448\">　ビルトイン</span>"}]}, {"type": "row", "cols": 2, "figs": [{"type": "fig", "src": "img/u08_kitchen_counter.jpg", "w": 1800, "h": 1350, "cap": "<span class=\"t\" data-i18n=\"L449\">キッチンカウンター</span><span class=\"d\" data-i18n=\"L450\">　ダークブラウンの鏡面扉</span>"}, {"type": "fig", "src": "img/u09_kitchen_hood.jpg", "w": 1800, "h": 1350, "cap": "<span class=\"t\" data-i18n=\"L451\">レンジフード</span><span class=\"d\" data-i18n=\"L452\">　ステンレスのフード</span>"}]}]}, {"no": "04 — Bedrooms", "light": true, "h2": "<h2 data-i18n=\"L453\">3つの洋室と、<br/>3つのウォークインクローゼット</h2>", "lead": "<p class=\"lead\" data-i18n=\"L454\">洋室(1)は約10.0帖、<br class=\"sp\"/>天井高約2.9mの主寝室。<br/>3室すべてがウッドデッキの<br class=\"sp\"/>バルコニーに面し、<br class=\"sp\"/>ウォールナットの床が続きます。<br/>浴室は1822サイズ。</p>", "blocks": [{"type": "row", "cols": 1, "figs": [{"type": "fig", "src": "img/u10_bed1_window.jpg", "w": 1800, "h": 1005, "cap": "<span class=\"t\" data-i18n=\"L455\">洋室(1) 約10.0帖</span><span class=\"d\" data-i18n=\"L456\">　バルコニー側</span>"}]}, {"type": "row", "cols": 2, "figs": [{"type": "fig", "src": "img/u11_bed1_entry.jpg", "w": 1600, "h": 900, "cap": "<span class=\"t\" data-i18n=\"L331\">洋室(1)</span><span class=\"d\" data-i18n=\"L457\">　入口側より</span>"}, {"type": "fig", "src": "img/u12_bed2.jpg", "w": 1800, "h": 1005, "cap": "<span class=\"t\" data-i18n=\"L458\">洋室(2) 約6.0帖</span><span class=\"d\" data-i18n=\"L459\">　WIC 1.2帖付き</span>"}]}, {"type": "row", "cols": 2, "figs": [{"type": "fig", "src": "img/u13_bed3.jpg", "w": 1800, "h": 1005, "cap": "<span class=\"t\" data-i18n=\"L460\">洋室(3) 約6.0帖</span><span class=\"d\" data-i18n=\"L461\">　WIC 0.8帖付き</span>"}, {"type": "fig", "src": "img/u14_bed_balcony.jpg", "w": 1800, "h": 1344, "cap": "<span class=\"t\" data-i18n=\"L462\">洋室からバルコニーへ</span><span class=\"d\" data-i18n=\"L463\">　ウッドデッキ</span>"}]}]}, {"no": "05 — Common Space", "light": false, "h2": "<h2 data-i18n=\"L066\">住まいの中の<br/>サード・プレイス</h2>", "lead": "<p data-i18n=\"L067\">1階・2階・29階に配した8つの共用施設。</p>", "blocks": [{"type": "html", "cls": "floors", "html": "<ul class=\"floors rv\">\n<li data-f=\"29\"><div class=\"f\">29F</div><div class=\"n\"><span data-i18n=\"L068\">スカイラウンジ</span><span data-i18n=\"L069\">ゲストルーム</span></div><div class=\"d\" data-i18n=\"L070\">バーカウンター付きラウンジ、2タイプのゲストルーム</div></li>\n<li data-f=\"2\"><div class=\"f\">2F</div><div class=\"n\"><span data-i18n=\"L071\">オーナーズラウンジ</span><span data-i18n=\"L072\">ファミリールーム</span><span data-i18n=\"L073\">フィットネスルーム</span></div><div class=\"d\" data-i18n=\"L074\">アートに囲まれた寛ぎと、家族の時間、トレーニング</div></li>\n<li data-f=\"1\"><div class=\"f\">1F</div><div class=\"n\"><span data-i18n=\"L075\">エントランスラウンジ</span><span data-i18n=\"L076\">ワークラウンジ</span><span data-i18n=\"L077\">ゴルフレンジ</span></div><div class=\"d\" data-i18n=\"L078\">個室ブース付きワークスペース、トラックマンレンジ</div></li>\n</ul>"}, {"type": "row", "cols": 1, "figs": [{"type": "fig", "src": "img/c09_sky_lounge.jpg", "w": 1600, "h": 996, "cap": "<span class=\"t\" data-i18n=\"L079\">29F スカイラウンジ</span><span class=\"d\" data-i18n=\"L080\">　レインボーブリッジ方面の眺望に向かって弧を描く家具配置</span>"}]}, {"type": "row", "cols": 3, "figs": [{"type": "fig", "src": "img/c10_sky_bar.jpg", "w": 1574, "h": 982, "cap": "<span class=\"t\" data-i18n=\"L068\">スカイラウンジ</span><span class=\"d\" data-i18n=\"L081\">　バーカウンター</span>"}, {"type": "fig", "src": "img/c11_guest1.jpg", "w": 1572, "h": 980, "cap": "<span class=\"t\" data-i18n=\"L082\">29F ゲストルーム</span><span class=\"d\" data-i18n=\"L083\">　サウナ・肩湯バス付き</span>"}, {"type": "fig", "src": "img/c12_guest2.jpg", "w": 1600, "h": 900, "cap": "<span class=\"t\" data-i18n=\"L082\">29F ゲストルーム</span><span class=\"d\" data-i18n=\"L084\">　銘木の設え</span>"}]}, {"type": "row", "cols": 3, "figs": [{"type": "fig", "src": "img/c06_owners_lounge.jpg", "w": 1600, "h": 900, "cap": "<span class=\"t\" data-i18n=\"L085\">2F オーナーズラウンジ</span>"}, {"type": "fig", "src": "img/c08_fitness.jpg", "w": 1600, "h": 900, "cap": "<span class=\"t\" data-i18n=\"L086\">2F フィットネスルーム</span><span class=\"d\" data-i18n=\"L087\">　TECHNOGYM社製マシンを導入</span>"}, {"type": "fig", "src": "img/c07_family.jpg", "w": 1600, "h": 900, "cap": "<span class=\"t\" data-i18n=\"L088\">2F ファミリールーム</span>"}]}, {"type": "row", "cols": 3, "figs": [{"type": "fig", "src": "img/c05_golf.jpg", "w": 1476, "h": 924, "cap": "<span class=\"t\" data-i18n=\"L089\">1F ゴルフレンジ</span><span class=\"d\" data-i18n=\"L090\">　トラックマンレンジ</span>"}, {"type": "fig", "src": "img/c04_work_lounge.jpg", "w": 1600, "h": 900, "cap": "<span class=\"t\" data-i18n=\"L091\">1F ワークラウンジ</span><span class=\"d\" data-i18n=\"L092\">　個室ブース付き</span>"}, {"type": "fig", "src": "img/c03_entrance_lounge.jpg", "w": 1476, "h": 924, "cap": "<span class=\"t\" data-i18n=\"L093\">1F エントランスラウンジ</span>"}]}]}, {"no": "06 — Entrance & Residence", "light": false, "h2": "<h2 data-i18n=\"L094\">帆船を思わせるフォルム、<br/>奥行き約50mの迎賓空間</h2>", "lead": "<p data-i18n=\"L095\">約12mのアプローチと高さ約8mの車寄せ。石張りの壁面に波の紋様、天井には竜骨状のオブジェ。</p>", "blocks": [{"type": "row", "cols": 1, "figs": [{"type": "fig", "src": "img/r05_porch.jpg", "w": 1600, "h": 615, "cap": "<span class=\"t\" data-i18n=\"L096\">車寄せ</span><span class=\"d\" data-i18n=\"L097\">　高さ約8mのキャノピー</span>"}]}, {"type": "row", "cols": 3, "figs": [{"type": "fig", "src": "img/c13_ev_hall.jpg", "w": 1600, "h": 900, "cap": "<span class=\"t\" data-i18n=\"L098\">エレベーターホール</span>"}, {"type": "fig", "src": "img/c14_corridor.jpg", "w": 1574, "h": 982, "cap": "<span class=\"t\" data-i18n=\"L099\">内廊下</span>"}, {"type": "fig", "src": "img/r03_approach.jpg", "w": 1600, "h": 844, "cap": "<span class=\"t\" data-i18n=\"L100\">メインエントランスアプローチ</span><span class=\"d\" data-i18n=\"L101\">　シオカゼザクラをシンボルツリーに</span>"}]}, {"type": "row", "cols": 2, "figs": [{"type": "f 5\">最上階ペントハウス</li><li data-i18n=\"L406\">北東角・2面バルコニー</li><li>3LDK＋3WIC</li><li data-i18n=\"L407\">専有 130.24㎡</li><li data-i18n=\"L408\">天井高 約2.9m</li><li data-i18n=\"L006\">2026年10月新築</li>\n</ul>", "price": "<p class=\"p\" data-i18n=\"L409\"><span data-i18n=\"L147\">販売価格</span><b data-i18n=\"L404\">6億円</b><small data-i18n=\"L008\">（税込）</small></p>", "keys": "<div class=\"keys\">\n<ul>\n<li><div class=\"v\">34<small>F</small></div><div class=\"k\">Top Floor</div></li>\n<li><div class=\"v\">130.24<small>㎡</small></div><div class=\"k\">Area</div></li>\n<li><div class=\"v\">3<small>LDK</small></div><div class=\"k\">Plan</div></li>\n<li><div class=\"v\" data-i18n=\"L198\">北東<small data-i18n=\"L199\">角</small></div><div class=\"k\">Corner</div></li>\n<li><div class=\"v\" data-i18n=\"L010\">815<small data-i18n=\"L011\">戸</small></div><div class=\"k\">Residences</div></li>\n<li><div class=\"v\" data-i18n=\"L012\">13<small data-i18n=\"L013\">分</small></div><div class=\"k\" data-i18n=\"L014\">品川駅 徒歩</div></li>\n</ul>\n</div>", "img": "img/cover_pdf.jpg"}, "back": {"img": "img/r12_ext_dusk2.jpg", "inner": "\n<p class=\"en rv\">Livio Tower Shinagawa — 3415 Penthouse</p>\n<h2 class=\"rv\" data-i18n=\"L483\">最上階の角部屋から、<br/>東京湾を暮らす。</h2>\n<p class=\"p rv\" data-i18n=\"L484\">販売価格<b data-i18n=\"L404\">6億円</b></p>\n<ul class=\"rv\">\n<li data-i18n=\"L485\">34階・最上階</li><li data-i18n=\"L275\">北東角</li><li>3LDK＋3WIC</li><li>130.24㎡</li><li data-i18n=\"L408\">天井高 約2.9m</li><li data-i18n=\"L006\">2026年10月新築</li>\n</ul>\n"}, "notes": "<p data-i18n=\"L486\">※専有部の写真は2026年6月・10月撮影（一部は空の色を画像処理で調整）、室内動画は2026年10月撮影（4倍速）。共用部・外観・周辺の写真および動画は竣工後に撮影されたもので、一部CG・完成予想図を含みます。</p><p data-i18n=\"L186\">※掲載内容は2026年10月現在のものです。共用施設・サービスの内容は管理規約に従い、変更となる場合があります。</p><p data-i18n=\"L187\">※家具・調度品は販売価格に含まれません。</p>", "brand": "LIVIO TOWER SHINAGAWA — 3415"};
const MM=3.7795;
function tr(el,dic,l){ if(l==='ja')return; el.querySelectorAll('[data-i18n]').forEach(e=>{const t=dic[l]&&dic[l][e.getAttribute('data-i18n')]; if(t)e.innerHTML=t;}); }
function fixSrc(h){ return h.replace(/ loading="lazy"/g,'').replace(/(src|poster)="(?!https?:|\.\.\/)([^"]+)"/g,'$1="../$2"'); }
function el(html){ const d=document.createElement('div'); d.innerHTML=fixSrc(html); return d.firstElementChild||d; }
function newPage(dark, label, n){
  const p=document.createElement('section'); p.className='page'+(dark?' dark':'');
  p.innerHTML='<div class="inner"></div><div class="foot"><span>'+DATA.brand+'</span><span>'+String(n).padStart(2,'0')+'</span></div>';
  document.body.appendChild(p); return p.querySelector('.inner');
}
function figHTML(f,h,contain){ const isMap=/map|route|schedule|plan2d|plan3d|png$/.test(f.src);
  return '<figure><div class="ph'+((contain||isMap)?' contain':'')+'" style="height:'+h+'mm"><img src="../'+f.src+'"></div>'+(f.cap?'<figcaption>'+f.cap+'</figcaption>':'')+'</figure>'; }
function blockEl(b){
  if(b.type==='row'){
    const W=182; let h;
    if(b.cols===1){ const f=b.figs[0]; h=Math.min(W*f.h/f.w, /plan/.test(f.src)?120:92); }
    else h=b.cols===2?56:40;
    const d=document.createElement('div'); d.className='row c'+b.cols; d.innerHTML=fixSrc(b.figs.map(f=>figHTML(f,h)).join('')); return d;
  }
  if(b.type==='table'){ const rows=b.rows; const half=rows.length>9?Math.ceil(rows.length/2):rows.length;
    const d=document.createElement('div'); d.className=rows.length>9?'tbl2':'';
    d.innerHTML='<table class="tbl">'+rows.slice(0,half).join('')+'</table>'+(rows.length>9?'<table class="tbl">'+rows.slice(half).join('')+'</table>':''); return d; }
  return el(b.html);
}
window.overflowPages=()=>[...document.querySelectorAll('.page .inner')].map((x,i)=>({i:i+1,o:x.scrollHeight-x.clientHeight})).filter(x=>x.o>2);
window.build=function(dic,l){
  document.documentElement.lang=l; let n=0;
  // cover
  const c=DATA.cover, cv=document.createElement('section'); cv.className='page cover';
  cv.innerHTML='<div class="bg"><img src="../'+c.img+'"></div><div class="in">'+c.en+c.no+c.h1+c.tag+c.spec.replace('class="spec"','class="spec"')+c.price+c.keys+'</div>';
  tr(cv,dic,l); document.body.appendChild(cv);
  // chapters
  const chs=DATA.chapters;
  if(chs.length){ const last=chs[chs.length-1]; (DATA.notes.match(/<p[\s\S]*?<\/p>/g)||[]).forEach(h=>last.blocks.push({type:'note',html:h.replace('<p','<p class="note"')})); }
  chs.forEach(ch=>{
    n++; let inner=newPage(!ch.light, ch.no, n);
    const hd=document.createElement('div'); hd.className='hd'; hd.innerHTML='<p class="no">'+ch.no+'</p>'+ch.h2+(ch.lead?ch.lead.replace(/class="[^"]*"/,'class="lead"'):''); tr(hd,dic,l); inner.appendChild(hd);
    ch.blocks.forEach(b=>{
      const e=blockEl(b); tr(e,dic,l); inner.appendChild(e);
      if(inner.scrollHeight>inner.clientHeight+2 && b.type==='row'){   // まず写真を縮めて収める
        const phs=[...e.querySelectorAll('.ph')]; const h0=parseFloat(phs[0].style.height);
        const need=(inner.scrollHeight-inner.clientHeight)/MM+1.5; const h1=h0-need;
        if(h1>=h0*0.55){ phs.forEach(x=>x.style.height=h1+'mm'); }
      }
      if(inner.scrollHeight>inner.clientHeight+2 && b.type==='row' && inner.children.length>1){ inner.removeChild(e); return; }  // 収まらない写真段は省く（寂しい続きページを作らない）
      if(inner.scrollHeight>inner.clientHeight+2 && inner.children.length>1){
        inner.removeChild(e); n++; inner=newPage(!ch.light, ch.no, n);
        const h=document.createElement('div'); h.className='hd'; h.innerHTML='<p class="no">'+ch.no+'</p>'; inner.appendChild(h); inner.appendChild(e);
      }
    });
  });
  // back
  const bk=document.createElement('section'); bk.className='page cover back';
  bk.innerHTML='<div class="bg"><img src="../'+DATA.back.img+'"></div><div class="in">'+fixSrc(DATA.back.inner)+'</div>';
  tr(bk,dic,l); document.body.appendChild(bk);
};
</script>
